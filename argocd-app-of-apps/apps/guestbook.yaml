apiVersion: v1
kind: Service
metadata:
  name: guestbook-ui
  labels:
    app: guestbook
spec:
  ports:
  - port: 80
    targetPort: 8080
    name: web
  selector:
    app: guestbook-ui
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  labels:
    app: guestbook-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - name: guestbook-ui
        image: gcr.io/gcp-practice/guestbook-ui:1.0
        ports:
        - containerPort: 8080

---