apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-stack
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: namespace
            wave: "-1"
            destNamespace: default  # <-- Deploy the namespace manifest from a default context
          - name: redis-master
            wave: "0"
            destNamespace: guestbook
          - name: redis-slave
            wave: "0"
            destNamespace: guestbook
          - name: guestbook
            wave: "1"
            destNamespace: guestbook
  template:
    metadata:
      name: "{{name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/alexz-ops/argocd.git
        targetRevision: HEAD
        path: "guestbook-k8s/{{name}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"  # <-- Dynamically set per element
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true